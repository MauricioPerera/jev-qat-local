name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install test and evaluation dependencies
        run: python -m pip install -e ".[test,evaluation]"
      - name: Python unit tests (no models or private artifacts)
        run: python -m pytest tests -q
      - name: Browser request and token-budget logic
        run: node --test scripts/test_e2b_questions.cjs
      - name: Build wheel and check bundled UI assets
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_wheel_assets.py

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build installer from committed snapshot
        run: python scripts/build_windows_installer.py --exe
      - name: Install from the single EXE with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $built = Get-ChildItem -LiteralPath dist/windows -Filter '*.exe' | Select-Object -First 1
          $exe = Join-Path $env:RUNNER_TEMP 'Instalador E2B ñ.exe'
          Copy-Item -LiteralPath $built.FullName -Destination $exe
          $install = Join-Path $env:RUNNER_TEMP 'E2B prueba Unicode ñ'
          & $exe --verify --non-interactive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe -InstallDir $install -DependenciesOnly --non-interactive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Jev QAT E2B'
          $shell = New-Object -ComObject WScript.Shell
          foreach ($name in @('Abrir E2B', 'Detener E2B')) {
            $shortcut = Join-Path $menu ($name + '.lnk')
            if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Missing Start menu shortcut' }
            if ($shell.CreateShortcut($shortcut).TargetPath -ne (Join-Path $install ($name + '.cmd'))) { throw 'Incorrect shortcut target' }
          }
          & (Join-Path $install 'python/python.exe') scripts/smoke_windows_install.py --install-dir $install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A second run must keep ports and reuse installed assets/wheels.
          & $exe -InstallDir $install -DependenciesOnly -NoShortcuts --non-interactive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
