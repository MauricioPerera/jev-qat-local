name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test and evaluation dependencies
        run: python -m pip install -e ".[test,evaluation]"
      - name: Python unit tests (no models or private artifacts)
        run: python -m pytest tests -q
      - name: Browser request and token-budget logic
        run: node --test scripts/test_e2b_questions.cjs
      - name: Build wheel and check bundled UI assets
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_wheel_assets.py
